name: wandersync

# Shared image for Prefect server, Dask scheduler/workers and the flow runner
x-pipeline: &pipeline
  build: ./pipeline
  image: wandersync/pipeline:local
  restart: unless-stopped

x-pipeline-env: &pipeline-env
  PREFECT_API_URL: http://prefect-server:4200/api
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL (Supabase session pooler URI) in .env}
  MOCK_PROVIDER_URL: http://mock-provider:8000
  HTTP_TIMEOUT_SECONDS: "5"

x-service: &service
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 10s

x-service-env: &service-env
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL (Supabase session pooler URI) in .env}
  DB_POOL_MAX: "2"

services:
  # ---------------------------------------------------------------------
  # Web frontend (React) -> http://localhost:3000
  # ---------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      args:
        VITE_GRAPHQL_URL: http://localhost:8080/graphql
    image: wandersync/frontend:local
    restart: unless-stopped
    ports:
      - "3000:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      gateway:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # GraphQL API Gateway: the single public entry point -> http://localhost:8080/graphql
  # ---------------------------------------------------------------------
  gateway:
    <<: *service
    build: ./gateway
    image: wandersync/gateway:local
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL (Supabase session pooler URI) in .env}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in .env}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?Set SUPABASE_SERVICE_KEY in .env}
      REDIS_URL: redis://:${REDIS_PASSWORD:-wandersync-dev-only}@redis:6379/0
      ORDERS_URL: http://orders-service:8000
      COOKIE_SECURE: "false"            # set "true" when served over HTTPS
      FRONTEND_ORIGINS: http://localhost:5173,http://localhost:3000
      GRAPHIQL: "true"                  # in-browser GraphQL explorer for the demo
      ALLOW_FAILURE_SIMULATION: "true"  # demo switch for SAGA failures
    ports:
      - "8080:8000"
    depends_on:
      redis:
        condition: service_healthy
      orders-service:
        condition: service_healthy

  # Session store + rate-limit counters (not exposed outside Docker)
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-wandersync-dev-only}", "--save", "", "--appendonly", "no"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-wandersync-dev-only}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------
  # Booking microservices. Ports are bound to 127.0.0.1 for local testing
  # only; the GraphQL gateway will be the single public entry point.
  # ---------------------------------------------------------------------
  flights-service:
    <<: *service
    build: { context: ./services, dockerfile: flights/Dockerfile }
    image: wandersync/flights-service:local
    environment:
      <<: *service-env
    ports:
      - "127.0.0.1:8001:8000"

  hotels-service:
    <<: *service
    build: { context: ./services, dockerfile: hotels/Dockerfile }
    image: wandersync/hotels-service:local
    environment:
      <<: *service-env
    ports:
      - "127.0.0.1:8002:8000"

  cars-service:
    <<: *service
    build: { context: ./services, dockerfile: cars/Dockerfile }
    image: wandersync/cars-service:local
    environment:
      <<: *service-env
    ports:
      - "127.0.0.1:8003:8000"

  # Orders / Billing + SAGA orchestrator
  orders-service:
    <<: *service
    build: { context: ./services, dockerfile: orders/Dockerfile }
    image: wandersync/orders-service:local
    environment:
      <<: *service-env
      FLIGHTS_URL: http://flights-service:8000
      HOTELS_URL: http://hotels-service:8000
      CARS_URL: http://cars-service:8000
      SERVICE_TIMEOUT_SECONDS: "5"
      PREFECT_API_URL: http://prefect-server:4200/api
      SAGA_DEPLOYMENT: booking-saga/booking-saga
      SAGA_FLOW_TIMEOUT_SECONDS: "55"
    ports:
      - "127.0.0.1:8004:8000"
    depends_on:
      flights-service:
        condition: service_healthy
      hotels-service:
        condition: service_healthy
      cars-service:
        condition: service_healthy
      saga-pipeline:
        condition: service_healthy

  # Fake Kayak / Booking / Rentalcars website, with injected failures
  mock-provider:
    build: ./mock-provider
    image: wandersync/mock-provider:local
    restart: unless-stopped
    environment:
      FAIL_RATE: ${MOCK_FAIL_RATE:-0.15}
      SLOW_RATE: ${MOCK_SLOW_RATE:-0.05}
      PRICE_BUCKET_SECONDS: ${MOCK_PRICE_BUCKET_SECONDS:-300}
    ports:
      - "8090:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Prefect UI + API -> http://localhost:4200
  prefect-server:
    <<: *pipeline
    command: prefect server start --host 0.0.0.0 --port 4200
    environment:
      PREFECT_HOME: /data/prefect
      PREFECT_UI_API_URL: http://localhost:4200/api
      PREFECT_UI_STATIC_DIRECTORY: /data/prefect/ui  # writable place for the UI bundle (the container runs as non-root)
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    volumes:
      - prefect-data:/data/prefect
    ports:
      - "4200:4200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Dask scheduler, dashboard -> http://localhost:8787
  dask-scheduler:
    <<: *pipeline
    command: dask scheduler --dashboard-address :8787
    ports:
      - "8787:8787"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8787/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  dask-worker:
    <<: *pipeline
    command: dask worker tcp://dask-scheduler:8786 --nthreads 4 --memory-limit 1GiB
    environment:
      <<: *pipeline-env
    depends_on:
      dask-scheduler:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
    deploy:
      replicas: 2

  # Runs the flow once on start, then every SCRAPE_INTERVAL_SECONDS
  pipeline:
    <<: *pipeline
    command: python -m flows.ingest
    environment:
      <<: *pipeline-env
      DASK_SCHEDULER_ADDRESS: tcp://dask-scheduler:8786
      SCRAPE_DAYS_AHEAD: ${SCRAPE_DAYS_AHEAD:-14}
      SCRAPE_INTERVAL_SECONDS: ${SCRAPE_INTERVAL_SECONDS:-300}
      SCRAPE_RUN_ON_START: "true"
    depends_on:
      prefect-server:
        condition: service_healthy
      dask-scheduler:
        condition: service_healthy
      dask-worker:
        condition: service_started
      mock-provider:
        condition: service_healthy

  # Serves the deployment that orchestrates each booking SAGA in Prefect.
  saga-pipeline:
    <<: *pipeline
    command: python -m flows.booking_saga
    environment:
      <<: *pipeline-env
      FLIGHTS_URL: http://flights-service:8000
      HOTELS_URL: http://hotels-service:8000
      CARS_URL: http://cars-service:8000
      SERVICE_TIMEOUT_SECONDS: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://prefect-server:4200/api/deployments/name/booking-saga/booking-saga')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      prefect-server:
        condition: service_healthy
      flights-service:
        condition: service_healthy
      hotels-service:
        condition: service_healthy
      cars-service:
        condition: service_healthy

volumes:
  prefect-data:
